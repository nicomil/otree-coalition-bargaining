name: Demo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt requests
      - run: otree test bargaining_tdl 18
